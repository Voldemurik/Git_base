name: Git Quest

on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  quest:
    name: Git Quest
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # ПОЛУЧАЕМ РЕПОЗИТОРИЙ
      # =========================================================

      - name: Получить репозиторий
        uses: actions/checkout@v4


      # =========================================================
      # ПЕРСОНАЛЬНЫЙ ВАРИАНТ
      # =========================================================

      - name: Определить персональный вариант
        shell: bash
        run: |
          USERNAME="${{ gitverse.actor }}"

          python3 scripts/quest_variant.py "$USERNAME" \
            > /tmp/variant.json

          VARIANT=$(
            python3 -c \
            "import json; print(json.load(open('/tmp/variant.json'))['number'])"
          )

          echo "========================================"
          echo "        GIT QUEST — ВАРИАНТ"
          echo "========================================"
          echo ""
          echo "Пользователь: $USERNAME"
          echo "Ветка:        ${{ gitverse.ref_name }}"
          echo "Вариант:      $VARIANT"


      # =========================================================
      # СОСТОЯНИЕ ТЕКУЩЕГО ЗАПУСКА
      # =========================================================

      - name: Подготовить состояние квеста
        shell: bash
        run: |
          rm -f /tmp/stop_quest
          rm -f /tmp/step_2_created
          rm -f /tmp/step_3_created
          rm -f /tmp/step_4_created
          rm -f /tmp/step_5_created
          rm -f /tmp/step_6_created


      # =========================================================
      # STEP 02 — ВЫДАЧА
      # =========================================================

      - name: Выдать шаг 2
        shell: bash
        run: |

          if [ -f "STEP_02.md" ]; then
            echo "STEP_02 уже был выдан."
            exit 0
          fi

          VARIANT=$(
            python3 -c \
            "import json; print(json.load(open('/tmp/variant.json'))['number'])"
          )

          RULE_1=$(
            python3 -c \
            "import json; print(json.load(open('/tmp/variant.json'))['gitignore'][0])"
          )

          RULE_2=$(
            python3 -c \
            "import json; print(json.load(open('/tmp/variant.json'))['gitignore'][1])"
          )

          RULE_3=$(
            python3 -c \
            "import json; print(json.load(open('/tmp/variant.json'))['gitignore'][2])"
          )

          mkdir -p .quest

          echo "$VARIANT" > .quest/variant

          cat > STEP_02.md <<EOF
          # Шаг 2. Файл .gitignore

          В проектах часто существуют файлы и каталоги,
          которые не должны попадать в репозиторий.

          Для этого Git использует специальный файл
          \`.gitignore\`.

          ## Ваше задание

          Создайте в корне репозитория файл:

          \`.gitignore\`

          Добавьте в него следующие правила:

          - \`$RULE_1\`
          - \`$RULE_2\`
          - \`$RULE_3\`

          После этого сохраните изменения, создайте коммит
          с понятным описанием и отправьте изменения.

          Не изменяйте:

          - \`STEP_02.md\`
          - \`.quest/variant\`

          > 💡 **Не появился следующий этап?**
          > Откройте раздел **CI/CD** и посмотрите результат
          > последней проверки.
          > Там будет указано, что необходимо исправить.
          EOF

          touch /tmp/step_2_created
          touch /tmp/stop_quest

          echo ""
          echo "========================================"
          echo "          ОТКРЫТ ШАГ 2"
          echo "========================================"


      # =========================================================
      # STEP 02 — СОХРАНЯЕМ
      # =========================================================

      - name: Сохранить шаг 2
        shell: bash
        run: |

          if [ ! -f "/tmp/step_2_created" ]; then
            exit 0
          fi

          git config user.name "Git Quest Bot"
          git config user.email "git-quest-bot@localhost"

          git add STEP_02.md .quest/variant
          git commit -m "quest: открыть шаг 2"
          git push origin HEAD:"${{ gitverse.ref_name }}"


      # =========================================================
      # STEP 02 — ПРОВЕРКА
      # =========================================================

      - name: Проверить шаг 2
        shell: bash
        run: |

          if [ -f "/tmp/stop_quest" ]; then
            echo "Шаг 2 только что выдан."
            echo "Ждём действий студента."
            exit 0
          fi

          echo ""
          echo "========================================"
          echo "     GIT QUEST — ПРОВЕРКА ШАГА 2"
          echo "========================================"
          echo ""

          if [ ! -f ".gitignore" ]; then
            echo "✗ Файл .gitignore не найден."
            echo ""
            echo "Сверьтесь с STEP_02.md."
            exit 1
          fi

          tr -d '\r' < .gitignore \
            > /tmp/gitignore_normalized

          MISSING=0

          for INDEX in 0 1 2; do

            RULE=$(
              python3 -c \
              "import json; print(json.load(open('/tmp/variant.json'))['gitignore'][$INDEX])"
            )

            if grep -Fxq "$RULE" /tmp/gitignore_normalized; then
              echo "✓ $RULE"
            else
              echo "✗ $RULE"
              MISSING=$((MISSING + 1))
            fi

          done

          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "Шаг 2 пока не завершён."
            echo "Не хватает правил: $MISSING"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "            ШАГ 2 ВЫПОЛНЕН"
          echo "========================================"


      # =========================================================
      # STEP 03 — ВЫДАЧА
      # =========================================================

      - name: Выдать шаг 3
        shell: bash
        run: |

          if [ -f "/tmp/stop_quest" ]; then
            exit 0
          fi

          if [ -f "STEP_03.md" ]; then
            echo "STEP_03 уже был выдан."
            exit 0
          fi

          python3 - <<'PY'
          import json

          with open("/tmp/variant.json", encoding="utf-8") as f:
              variant = json.load(f)

          with open(".env", "w", encoding="utf-8") as f:
              for key, value in variant["env"].items():
                  f.write(f"{key}={value}\n")
          PY

          cat > STEP_03.md <<'EOF'
          # Шаг 3. Кажется, кто-то закоммитил секреты 😱

          Вы подключились к проекту после другого разработчика.

          В репозитории оказался файл `.env` с настройками,
          похожими на API-ключи и другие секреты.

          **Все значения в задании вымышленные.**

          ## Ваша задача

          ### 1. Создайте `env_example`

          Скопируйте туда все имена переменных из `.env`,
          но удалите их значения.

          Например:

              OPENAI_API_KEY=secret

          должно стать:

              OPENAI_API_KEY=

          ### 2. Удалите `.env`

          Файл `.env` не должен остаться в проекте.

          ### 3. Добавьте `.env` в `.gitignore`

          Добавьте правило:

          `.env`

          ### 4. Сохраните изменения

          Создайте коммит с понятным описанием
          и отправьте изменения.

          > 💡 **Не появился следующий этап?**
          > Откройте раздел **CI/CD** и посмотрите результат
          > последней проверки.
          > Там будет указано, что необходимо исправить.
          EOF

          touch /tmp/step_3_created
          touch /tmp/stop_quest

          echo ""
          echo "========================================"
          echo "          ОТКРЫТ ШАГ 3"
          echo "========================================"


      # =========================================================
      # STEP 03 — СОХРАНЯЕМ
      # =========================================================

      - name: Сохранить шаг 3
        shell: bash
        run: |

          if [ ! -f "/tmp/step_3_created" ]; then
            exit 0
          fi

          git config user.name "Git Quest Bot"
          git config user.email "git-quest-bot@localhost"

          git add -f .env
          git add STEP_03.md

          git commit -m "quest: открыть шаг 3"
          git push origin HEAD:"${{ gitverse.ref_name }}"


      # =========================================================
      # STEP 03 — ПРОВЕРКА
      # =========================================================

      - name: Проверить шаг 3
        shell: bash
        run: |

          if [ -f "/tmp/step_3_created" ]; then
            echo "Шаг 3 только что выдан."
            exit 0
          fi

          if [ ! -f "STEP_03.md" ]; then
            exit 0
          fi

          echo ""
          echo "========================================"
          echo "     GIT QUEST — ПРОВЕРКА ШАГА 3"
          echo "========================================"
          echo ""

          ERRORS=0

          if [ ! -f "env_example" ]; then

            echo "✗ env_example не найден"
            ERRORS=$((ERRORS + 1))

          else

            echo "✓ env_example найден"

            tr -d '\r' < env_example \
              > /tmp/env_example_normalized

            python3 - <<'PY' > /tmp/env_keys
          import json

          with open("/tmp/variant.json", encoding="utf-8") as f:
              variant = json.load(f)

          for key in variant["env"]:
              print(key)
          PY

            while IFS= read -r KEY; do

              if grep -Fxq "${KEY}=" /tmp/env_example_normalized; then
                echo "✓ $KEY"
              else
                echo "✗ $KEY — отсутствует или содержит значение"
                ERRORS=$((ERRORS + 1))
              fi

            done < /tmp/env_keys

          fi


          echo ""

          if [ -e ".env" ]; then
            echo "✗ .env всё ещё находится в проекте"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ .env удалён"
          fi


          if [ ! -f ".gitignore" ]; then

            echo "✗ .gitignore не найден"
            ERRORS=$((ERRORS + 1))

          else

            tr -d '\r' < .gitignore \
              > /tmp/gitignore_normalized

            if grep -Fxq ".env" /tmp/gitignore_normalized; then
              echo "✓ .env добавлен в .gitignore"
            else
              echo "✗ .env отсутствует в .gitignore"
              ERRORS=$((ERRORS + 1))
            fi

          fi


          if [ "$ERRORS" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "       ШАГ 3 ПОКА НЕ ЗАВЕРШЁН"
            echo "========================================"
            echo ""
            echo "Найдено проблем: $ERRORS"
            echo "Сверьтесь с STEP_03.md."
            exit 1
          fi


          echo ""
          echo "========================================"
          echo "            ШАГ 3 ВЫПОЛНЕН"
          echo "========================================"


      # =========================================================
      # STEP 04 — ВЫДАЧА
      # =========================================================

      - name: Выдать шаг 4
        shell: bash
        run: |

          if [ -f "/tmp/stop_quest" ]; then
            exit 0
          fi

          if [ -f "STEP_04.md" ]; then
            echo "STEP_04 уже был выдан."
            exit 0
          fi


          SOURCE_FILE=$(
            python3 -c \
            "import json; print(json.load(open('/tmp/variant.json'))['step4']['source_file'])"
          )

          SOURCE_TOPIC=$(
            python3 -c \
            "import json; print(json.load(open('/tmp/variant.json'))['step4']['source_topic'])"
          )

          DOCUMENT_FILE=$(
            python3 -c \
            "import json; print(json.load(open('/tmp/variant.json'))['step4']['document_file'])"
          )

          DOCUMENT_TOPIC=$(
            python3 -c \
            "import json; print(json.load(open('/tmp/variant.json'))['step4']['document_topic'])"
          )


          cat > STEP_04.md <<EOF
          # Шаг 4. Структура проекта

          Репозиторий начинает превращаться в настоящий проект.

          Теперь необходимо правильно организовать его файлы.

          ## 1. Исходный код

          Создайте файл:

          \`$SOURCE_FILE\`

          Задание для этого файла:

          **$SOURCE_TOPIC.**

          Файл должен:

          - быть написан на Python;
          - содержать осмысленный код;
          - быть непустым;
          - запускаться без ошибки.

          Сложную программу писать не требуется.


          ## 2. Документация

          Создайте файл:

          \`$DOCUMENT_FILE\`

          Задание:

          **$DOCUMENT_TOPIC.**

          Содержание этого файла будет проверено
          преподавателем отдельно.

          Автоматическая проверка проверит только наличие
          документа и то, что файл не пустой.


          ## 3. Сохраните изменения

          В результате в репозитории должны появиться
          каталоги:

          \`src\`

          и:

          \`docs\`

          Создайте коммит с кратким, но понятным описанием
          выполненной работы и отправьте изменения.


          > 💡 **Не появился следующий этап?**
          > Откройте раздел **CI/CD** и посмотрите результат
          > последней проверки.
          > Там будет указано, что необходимо исправить.
          EOF


          touch /tmp/step_4_created
          touch /tmp/stop_quest


          echo ""
          echo "========================================"
          echo "          ОТКРЫТ ШАГ 4"
          echo "========================================"
          echo ""
          echo "Исходный файл: $SOURCE_FILE"
          echo "Документ:       $DOCUMENT_FILE"


      # =========================================================
      # STEP 04 — СОХРАНЯЕМ ЗАДАНИЕ
      # =========================================================

      - name: Сохранить шаг 4
        shell: bash
        run: |

          if [ ! -f "/tmp/step_4_created" ]; then
            exit 0
          fi

          git config user.name "Git Quest Bot"
          git config user.email "git-quest-bot@localhost"

          git add STEP_04.md

          git commit -m "quest: открыть шаг 4"
          git push origin HEAD:"${{ gitverse.ref_name }}"


      # =========================================================
      # STEP 04 — ПРОВЕРКА
      # =========================================================

      - name: Проверить шаг 4
        shell: bash
        run: |

          if [ -f "/tmp/step_4_created" ]; then
            echo "Шаг 4 только что выдан."
            echo "Ждём действий студента."
            exit 0
          fi

          if [ ! -f "STEP_04.md" ]; then
            exit 0
          fi


          SOURCE_FILE=$(
            python3 -c \
            "import json; print(json.load(open('/tmp/variant.json'))['step4']['source_file'])"
          )

          DOCUMENT_FILE=$(
            python3 -c \
            "import json; print(json.load(open('/tmp/variant.json'))['step4']['document_file'])"
          )


          echo ""
          echo "========================================"
          echo "     GIT QUEST — ПРОВЕРКА ШАГА 4"
          echo "========================================"
          echo ""


          ERRORS=0


          # -----------------------------------------------------
          # SRC
          # -----------------------------------------------------

          echo "Проверяем исходный код:"
          echo ""


          if [ ! -d "src" ]; then

            echo "✗ Каталог src не найден"
            ERRORS=$((ERRORS + 1))

          else

            echo "✓ Каталог src найден"

          fi


          if [ ! -f "$SOURCE_FILE" ]; then

            echo "✗ Файл $SOURCE_FILE не найден"
            ERRORS=$((ERRORS + 1))

          elif [ ! -s "$SOURCE_FILE" ]; then

            echo "✗ Файл $SOURCE_FILE пустой"
            ERRORS=$((ERRORS + 1))

          else

            echo "✓ Файл $SOURCE_FILE найден"
            echo "✓ Файл не пустой"

            echo ""
            echo "Пробуем запустить программу..."

            if python3 "$SOURCE_FILE"; then

              echo ""
              echo "✓ Программа завершилась без ошибки"

            else

              echo ""
              echo "✗ Программа завершилась с ошибкой"
              echo ""
              echo "Запустите файл локально и исправьте ошибку."

              ERRORS=$((ERRORS + 1))

            fi

          fi


          # -----------------------------------------------------
          # DOCS
          # -----------------------------------------------------

          echo ""
          echo "Проверяем документацию:"
          echo ""


          if [ ! -d "docs" ]; then

            echo "✗ Каталог docs не найден"
            ERRORS=$((ERRORS + 1))

          else

            echo "✓ Каталог docs найден"

          fi


          if [ ! -f "$DOCUMENT_FILE" ]; then

            echo "✗ Файл $DOCUMENT_FILE не найден"
            ERRORS=$((ERRORS + 1))

          elif [ ! -s "$DOCUMENT_FILE" ]; then

            echo "✗ Файл $DOCUMENT_FILE пустой"
            ERRORS=$((ERRORS + 1))

          else

            echo "✓ Файл $DOCUMENT_FILE найден"
            echo "✓ Файл не пустой"

          fi


          # -----------------------------------------------------
          # РЕЗУЛЬТАТ
          # -----------------------------------------------------

          echo ""


          if [ "$ERRORS" -ne 0 ]; then

            echo "========================================"
            echo "       ШАГ 4 ПОКА НЕ ЗАВЕРШЁН"
            echo "========================================"
            echo ""
            echo "Найдено проблем: $ERRORS"
            echo ""
            echo "Сверьтесь с STEP_04.md."
            echo ""
            echo "После исправления создайте новый коммит"
            echo "и отправьте изменения."

            exit 1

          fi


          echo "========================================"
          echo "            ШАГ 4 ВЫПОЛНЕН"
          echo "========================================"
          echo ""
          echo "✓ структура каталогов создана"
          echo "✓ $SOURCE_FILE существует"
          echo "✓ исходный файл не пустой"
          echo "✓ программа запускается без ошибки"
          echo "✓ $DOCUMENT_FILE существует"
          echo "✓ документ не пустой"
          echo ""
          echo "ℹ Содержание документа будет проверено"
          echo "  преподавателем отдельно."

      # =========================================================
      # STEP 05 — ВЫДАЧА
      # =========================================================

      - name: Выдать шаг 5
        shell: bash
        run: |

          # Если предыдущий этап только что был выдан,
          # дальше в этом запуске не идём.
          if [ -f "/tmp/stop_quest" ]; then
            exit 0
          fi

          if [ -f "STEP_05.md" ]; then
            echo "STEP_05 уже был выдан."
            exit 0
          fi

          cat > STEP_05.md <<'EOF'
          # Шаг 5. README проекта

          Проект уже содержит исходный код, конфигурацию
          и документацию.

          Но человеку, который впервые откроет репозиторий,
          пока трудно понять, что это за проект и как он устроен.

          Ваша задача — создать качественный `README.md`.

          ## 1. Разберитесь с проектом

          Перед написанием README внимательно изучите
          содержимое репозитория.

          Обратите внимание на:

          - исходный код в каталоге `src`;
          - файлы в каталоге `docs`;
          - пример конфигурации `env_example`;
          - структуру проекта в целом.

          По этим файлам самостоятельно определите назначение
          проекта и используемые в нём технологии.

          ## 2. Создайте README.md

          Создайте в корне репозитория файл:

          `README.md`

          README должен содержать:

          ### Название проекта

          Придумайте короткое название, соответствующее
          содержимому проекта.

          ### Описание

          Кратко объясните:

          - для чего предназначен проект;
          - что делает программа;
          - какие технологии или компоненты используются.

          Необходимую информацию найдите самостоятельно
          в файлах репозитория.

          ### Структура репозитория

          Покажите структуру проекта и укажите реальные
          файлы вашего варианта задания.

          Например:

              project/
              ├── src/
              │   └── ...
              ├── docs/
              │   └── ...
              ├── env_example
              └── README.md

          ### Запуск

          Добавьте краткую инструкцию, объясняющую,
          как запустить программу из каталога `src`.

          ### Конфигурация

          Объясните назначение `env_example` и как на его
          основе подготовить локальную конфигурацию приложения.

          Не переносите значения секретов из истории
          репозитория в README.

          ## 3. Проверьте результат

          Представьте, что репозиторий впервые открыл
          другой разработчик.

          Из README он должен суметь понять:

          - что это за проект;
          - какие технологии используются;
          - из каких основных файлов и каталогов он состоит;
          - как запустить программу;
          - как подготовить конфигурацию.

          ## 4. Сохраните изменения

          Создайте коммит с кратким, но понятным описанием
          выполненной работы и отправьте изменения.

          > 💡 **Не появился следующий этап?**
          > Откройте раздел **CI/CD** и посмотрите результат
          > последней проверки.
          > Там будет указано, что необходимо исправить.
          EOF

          touch /tmp/step_5_created
          touch /tmp/stop_quest

          echo ""
          echo "========================================"
          echo "          ОТКРЫТ ШАГ 5"
          echo "========================================"
          echo ""
          echo "Создайте README.md."
          echo "Внимательно изучите содержимое репозитория."


      # =========================================================
      # STEP 05 — СОХРАНЯЕМ ЗАДАНИЕ
      # =========================================================

      - name: Сохранить шаг 5
        shell: bash
        run: |

          if [ ! -f "/tmp/step_5_created" ]; then
            exit 0
          fi

          git config user.name "Git Quest Bot"
          git config user.email "git-quest-bot@localhost"

          git add STEP_05.md
          git commit -m "quest: открыть шаг 5"
          git push origin HEAD:"${{ gitverse.ref_name }}"


      # =========================================================
      # STEP 05 — ПРОВЕРКА
      # =========================================================

      - name: Проверить шаг 5
        shell: bash
        run: |

          if [ -f "/tmp/step_5_created" ]; then
            echo "Шаг 5 только что выдан."
            echo "Ждём действий студента."
            exit 0
          fi

          if [ ! -f "STEP_05.md" ]; then
            exit 0
          fi

          echo ""
          echo "========================================"
          echo "     GIT QUEST — ПРОВЕРКА ШАГА 5"
          echo "========================================"
          echo ""

          ERRORS=0

          if [ ! -f "README.md" ]; then
            echo "✗ README.md не найден."
            echo "Сверьтесь с STEP_05.md."
            exit 1
          fi

          if [ ! -s "README.md" ]; then
            echo "✗ README.md пустой."
            exit 1
          fi

          echo "✓ README.md найден"
          echo "✓ README.md не пустой"

          tr -d '\r' < README.md > /tmp/readme_normalized

          echo ""
          echo "Проверяем объём README:"
          echo ""

          README_SIZE=$(wc -c < /tmp/readme_normalized)

          if [ "$README_SIZE" -lt 300 ]; then
            echo "✗ README слишком короткий"
            echo "  Сейчас: $README_SIZE символов"
            echo "  Минимум: 300"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ README содержит достаточно информации"
          fi

          echo ""
          echo "Проверяем описание проекта:"
          echo ""

          python3 - <<'PY' > /tmp/readme_keywords
          import json

          with open("/tmp/variant.json", encoding="utf-8") as f:
              variant = json.load(f)

          for keyword in variant["step5"]["keywords"]:
              print(keyword)
          PY

          KEYWORD_NUMBER=0

          while IFS= read -r KEYWORD; do
            KEYWORD_NUMBER=$((KEYWORD_NUMBER + 1))

            if grep -Fqi "$KEYWORD" /tmp/readme_normalized; then
              echo "✓ технология проекта №$KEYWORD_NUMBER описана"
            else
              echo "✗ не хватает информации о технологии проекта №$KEYWORD_NUMBER"
              ERRORS=$((ERRORS + 1))
            fi
          done < /tmp/readme_keywords

          SOURCE_FILE=$(
            python3 -c \
            "import json; print(json.load(open('/tmp/variant.json'))['step4']['source_file'])"
          )

          DOCUMENT_FILE=$(
            python3 -c \
            "import json; print(json.load(open('/tmp/variant.json'))['step4']['document_file'])"
          )

          echo ""
          echo "Проверяем описание структуры:"
          echo ""

          if grep -Fqi "src" /tmp/readme_normalized; then
            echo "✓ каталог src упомянут"
          else
            echo "✗ каталог src не найден в README"
            ERRORS=$((ERRORS + 1))
          fi

          if grep -Fqi "$SOURCE_FILE" /tmp/readme_normalized; then
            echo "✓ исходный файл указан"
          else
            echo "✗ в README не указан исходный файл проекта"
            ERRORS=$((ERRORS + 1))
          fi

          if grep -Fqi "docs" /tmp/readme_normalized; then
            echo "✓ каталог docs упомянут"
          else
            echo "✗ каталог docs не найден в README"
            ERRORS=$((ERRORS + 1))
          fi

          if grep -Fqi "$DOCUMENT_FILE" /tmp/readme_normalized; then
            echo "✓ документ проекта указан"
          else
            echo "✗ в README не указан документ из каталога docs"
            ERRORS=$((ERRORS + 1))
          fi

          if grep -Fqi "env_example" /tmp/readme_normalized; then
            echo "✓ env_example упомянут"
          else
            echo "✗ env_example не упомянут"
            ERRORS=$((ERRORS + 1))
          fi

          echo ""
          echo "Проверяем инструкцию запуска:"
          echo ""

          if grep -Eqi 'python|python3' /tmp/readme_normalized; then
            echo "✓ Python упомянут"
          else
            echo "✗ не найдена инструкция запуска через Python"
            ERRORS=$((ERRORS + 1))
          fi

          SOURCE_BASENAME=$(basename "$SOURCE_FILE")

          if grep -Fqi "$SOURCE_BASENAME" /tmp/readme_normalized; then
            echo "✓ имя запускаемого файла указано"
          else
            echo "✗ не найдено имя запускаемого файла"
            ERRORS=$((ERRORS + 1))
          fi

          echo ""

          if [ "$ERRORS" -ne 0 ]; then
            echo "========================================"
            echo "       ШАГ 5 ПОКА НЕ ЗАВЕРШЁН"
            echo "========================================"
            echo ""
            echo "Найдено проблем: $ERRORS"
            echo ""
            echo "Внимательно изучите файлы проекта"
            echo "и дополните README."
            echo ""
            echo "После исправления создайте новый коммит"
            echo "и отправьте изменения."
            exit 1
          fi

          echo "========================================"
          echo "            ШАГ 5 ВЫПОЛНЕН"
          echo "========================================"
          echo ""
          echo "✓ README.md создан"
          echo "✓ проект описан"
          echo "✓ основные технологии определены"
          echo "✓ структура репозитория описана"
          echo "✓ реальные файлы проекта указаны"
          echo "✓ инструкция запуска добавлена"
          echo "✓ конфигурация описана"
          echo ""
          echo "Отличная работа!"

      # =========================================================
      # STEP 06 — ФИНАЛЬНАЯ ПРОВЕРКА
      # =========================================================

      - name: Выдать шаг 6
        shell: bash
        run: |

          # Если на этом запуске был выдан предыдущий этап,
          # следующий пока не открываем.
          if [ -f "/tmp/stop_quest" ]; then
            exit 0
          fi

          if [ -f "STEP_06.md" ]; then
            echo "STEP_06 уже был выдан."
            exit 0
          fi

          cat > STEP_06.md <<'EOF'
          # Шаг 6. Итоговая проверка

          Основная часть задания завершена.

          Теперь необходимо запустить итоговую автоматическую
          проверку всего репозитория и истории Git.

          ## 1. Запустите итоговую проверку

          1. Убедитесь, что все изменения сохранены
             в коммитах и отправлены в GitVerse.
          2. Откройте раздел **CI/CD** репозитория.
          3. Найдите workflow **Git Quest — итоговая проверка**.
          4. Запустите его вручную для вашей рабочей ветки.
          5. Дождитесь завершения проверки и изучите результат.

          Итоговая проверка проверяет не только файлы проекта,
          но и историю вашей работы с Git.

          В рабочей ветке должно быть:

          - не менее **8 ваших собственных коммитов**;
          - среди них не менее **3 коммитов с осмысленными
            сообщениями**.

          Стандартные сообщения GitVerse вроде `Create: ...`,
          `Update: ...` и `Delete: ...` учитываются в общем
          количестве коммитов, но не считаются осмысленными
          сообщениями.

          Коммиты **Git Quest Bot** не учитываются.

          Если содержательных сообщений пока меньше трёх,
          **не нужно переписывать старые коммиты**.
          Продолжайте работу обычным способом и используйте
          понятные описания в следующих коммитах.

          Если итоговая проверка обнаружит другую проблему,
          исправьте её, создайте новый коммит, отправьте изменения
          и снова запустите итоговый workflow вручную.

          ## 2. Создайте Pull Request

          Когда workflow **Git Quest — итоговая проверка**
          завершится успешно, создайте **Pull Request**
          из вашей рабочей ветки в ветку `master`.

          Pull Request — последнее действие этого задания.

          После его создания работа считается отправленной
          на проверку преподавателю.
          EOF

          touch /tmp/step_6_created
          touch /tmp/stop_quest

          echo ""
          echo "========================================"
          echo "          ОТКРЫТ ШАГ 6"
          echo "========================================"
          echo ""
          echo "Основная часть квеста выполнена."
          echo "Откройте STEP_06.md и запустите"
          echo "итоговую проверку вручную."


      - name: Сохранить шаг 6
        shell: bash
        run: |

          if [ ! -f "/tmp/step_6_created" ]; then
            exit 0
          fi

          git config user.name "Git Quest Bot"
          git config user.email "git-quest-bot@localhost"

          git add STEP_06.md
          git commit -m "quest: открыть шаг 6"
          git push origin HEAD:"${{ gitverse.ref_name }}"

